<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcoLife - Ecosystem Simulation and Analysis</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- login page -->
<div id="login-view">
  <div class="login-box">
    <h1>EcoLife</h1>
    <p>Ecosystem Simulation and Analysis System</p>
    <form id="login-form">
      <p><label for="login-user">Username</label><br>
         <input id="login-user" type="text" maxlength="40" required></p>
      <p><label for="login-pass">Password</label><br>
         <input id="login-pass" type="password" required></p>
      <p id="login-error" class="error" hidden></p>
      <p><button type="submit">Login</button></p>
    </form>
    <p class="small">College PBL project: C (Data Structures) and C++ (OOP)</p>
  </div>
</div>

<!-- main application (shown after login) -->
<div id="app-view" hidden>
  <div class="header">
    <span class="title">EcoLife</span>
    <span>User: <b id="user-name"></b> <button id="logout-btn">Logout</button></span>
  </div>

  <div class="menu" id="nav">
    <a href="#/dashboard"  data-page="dashboard">Dashboard</a>
    <a href="#/population" data-page="population">1. Population</a>
    <a href="#/resources"  data-page="resources">2. Resources</a>
    <a href="#/events"     data-page="events">3. Events</a>
    <a href="#/foodweb"    data-page="foodweb">4. Food Web</a>
    <a href="#/simulation" data-page="simulation">5. Simulation</a>
  </div>

  <div class="status" id="status-bar"></div>

  <div class="container">
    <h2 id="page-title">Dashboard</h2>
    <p id="message"></p>
    <div id="content"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
<script src="js/controls.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/population.js"></script>
<script src="js/resources.js"></script>
<script src="js/events.js"></script>
<script src="js/foodweb.js"></script>
<script src="js/simulation.js"></script>
<script>App.start();</script>
</body>
</html>
